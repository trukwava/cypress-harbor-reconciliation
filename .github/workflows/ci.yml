name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, compile, and run automated tests
        run: npm test

  browser:
    # Playwright 1.56 Chromium dependencies are supported on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TypeScript build dependencies
        run: npm install --no-audit --no-fund
      - name: Build local demo
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise browser finance workflow on a disposable synthetic database
        run: python tests/browser_smoke.py
