<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#122a30"/>
  <title>Cypress Harbor · Reconciliation</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand"><div class="brand-mark" aria-hidden="true">CH</div><div><strong>Cypress Harbor</strong><small>Financial operations</small></div></div>
      <div class="workspace-tag"><span class="pulse"></span> SYNTHETIC DEMO <span class="tag-split">LOCAL ONLY</span></div>
      <nav class="nav" id="navigation" aria-label="Work areas">
        <button class="nav-item active" data-page="queue"><span class="nav-icon">▦</span> Exception queue <span class="nav-count" id="nav-count">—</span></button>
        <button class="nav-item" data-page="matches"><span class="nav-icon">⤳</span> Match review</button>
        <button class="nav-item" data-page="imports"><span class="nav-icon">⇧</span> Source imports</button>
        <button class="nav-item" data-page="registry"><span class="nav-icon">⌂</span> Property registry</button>
        <button class="nav-item" data-page="history"><span class="nav-icon">◷</span> Runs & exports</button>
      </nav>
      <div class="sidebar-bottom"><div class="bottom-icon">!</div><div><b>Review-only workflow</b><p>No payments or accounting ledgers are changed by this application.</p></div></div>
      <div class="sidebar-version">Rules <span id="rule-label">CHH-1.0.0</span> · Demo session</div>
    </aside>
    <main class="main" id="main">
      <header class="topbar"><div><div class="breadcrumb">WORKSPACE <span>/</span> <span id="crumb">Exception queue</span></div><div class="topline"><span class="dot"></span> <span>Source-backed explanations</span></div></div><div class="header-actions"><span class="timezone">Dates: America/New_York</span><button id="run-reconcile" class="btn primary">↻ &nbsp; Run reconciliation</button></div></header>
      <div class="content">
        <div id="alert" class="alert hidden" role="status" aria-live="polite"></div>
        <div id="loading" class="loading" role="status">Loading workspace and evidence…</div>
        <div id="content" aria-live="off"></div>
      </div>
    </main>
  </div>
  <dialog id="detail-dialog" class="dialog"><div id="dialog-content"></div></dialog>
</body>
</html>
